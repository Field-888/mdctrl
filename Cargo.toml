[workspace]
resolver = "3"
members = [
    "crates/mdctrl-protocol",
    "crates/mdctrl-core",
    "crates/mdctrl-render",
    "crates/mdctrl-server",
    "crates/mdctrl-tui",
    "crates/mdctrl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mdctrl-protocol = { path = "crates/mdctrl-protocol" }
mdctrl-core = { path = "crates/mdctrl-core" }
mdctrl-render = { path = "crates/mdctrl-render" }
mdctrl-server = { path = "crates/mdctrl-server" }
mdctrl-tui = { path = "crates/mdctrl-tui" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
