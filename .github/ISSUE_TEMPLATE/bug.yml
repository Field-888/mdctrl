name: Bug
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        提供最小复现步骤。安全漏洞通过私有报告渠道提交。

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 描述观察到的异常、错误输出或偏离预期的表现。
      placeholder: 例如：表格中的 CJK 文本宽度计算错误
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与行为
      description: 按顺序记录操作步骤，并说明期望行为与实际行为。
      placeholder: |
        1. ...
        2. ...
        3. ...

        期望：
        实际：
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、终端、mdctrl 版本、Rust 版本与安装方式。
      placeholder: |
        - OS:
        - Terminal:
        - mdctrl --version:
        - Rust:
        - 安装方式:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 使用代码块粘贴日志；截图可直接拖入。
      render: text

  - type: dropdown
    id: areas
    attributes:
      label: 影响范围
      description: 可多选。
      multiple: true
      options:
        - protocol
        - core
        - render
        - server
        - tui
        - cli
        - docs
        - ci
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 关联 Issue 或 session
      placeholder: "#12 或 docs/archive/sessions/..."

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue。
          required: true
        - label: 内容已完成脱敏。
          required: true
